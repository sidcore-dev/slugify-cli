[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slugify-cli"
version = "1.0.0"
description = "Convert text to URL-safe slugs, or slugify filenames in a directory, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["slug", "slugify", "cli", "devtools", "filenames"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Text Processing",
]

[project.scripts]
slugify-cli = "slugify_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
